apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-api
  namespace: study
  labels:
    app: simple-api-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: simple-api-app
  template:
    metadata:
      labels:
        app: simple-api-app
    spec:
      containers:
      - name: simple-api
        envFrom:
          - configMapRef:
              name: simple-api
        image: sathlerhe/simple-api:latest
        ports:
        - containerPort: 8000
        imagePullPolicy: Always

